<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Fullscreen Studio — AlphaMat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Google Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    :root {
      --bg-space: #0b111e;
      --bg-panel: rgba(18, 26, 43, 0.85);
      --border-panel: rgba(255, 255, 255, 0.12);
      --coral: #EB5E41;
      --amber: #F59E0B;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --glow: rgba(235, 94, 65, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #172338 0%, #0b111e 100%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Floating Bar */
    .fs-header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-panel);
      padding: 10px 24px;
      border-radius: 50px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    }

    .fs-logo {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .fs-logo span {
      color: var(--coral);
    }

    .fs-divider {
      width: 1px;
      height: 20px;
      background: var(--border-panel);
    }

    .fs-specimen-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #F8FAFC;
    }

    .fs-badge {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(235, 94, 65, 0.2);
      color: #FF8A65;
      border: 1px solid rgba(235, 94, 65, 0.4);
    }

    /* Model Viewer */
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
      outline: none;
    }

    /* Floating Controls Bar at Bottom */
    .fs-controls-dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-panel);
      padding: 8px 18px;
      border-radius: 50px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .fs-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 30px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .fs-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .fs-btn.primary {
      background: linear-gradient(135deg, #EB5E41, #F59E0B);
      border: none;
      box-shadow: 0 6px 20px rgba(235, 94, 65, 0.35);
    }

    .fs-btn.primary:hover {
      box-shadow: 0 8px 26px rgba(235, 94, 65, 0.5);
    }

    .fs-btn.danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
    }

    .fs-btn.danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    /* Hints Overlay */
    .fs-gesture-hint {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.82rem;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      pointer-events: none;
      backdrop-filter: blur(8px);
      letter-spacing: 0.03em;
    }

    /* Loading Spinner */
    .fs-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b111e;
      z-index: 200;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .fs-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--coral);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div class="fs-loader" id="fsLoader">
    <div class="spinner"></div>
    <p style="font-weight: 700; color: #E2E8F0; font-size: 1.05rem;">Loading 3D Specimen Studio...</p>
    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;" id="fsLoaderName"></p>
  </div>

  <!-- Top Floating Bar -->
  <div class="fs-header">
    <div class="fs-logo">Alpha<span>Mat</span></div>
    <div class="fs-divider"></div>
    <div class="fs-specimen-title" id="fsTitle">3D AR Specimen</div>
    <span class="fs-badge" id="fsCategoryBadge">3D Studio</span>
  </div>

  <!-- 3D Model Stage -->
  <model-viewer
    id="fsModelViewer"
    src=""
    alt="AlphaMat 3D Model"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="18deg"
    shadow-intensity="1.6"
    shadow-softness="0.75"
    exposure="1.1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-orbit="0deg 75deg 105%"
    interaction-prompt="none">
  </model-viewer>

  <div class="fs-gesture-hint">
    👆 Drag to rotate • ✌️ Pinch/Scroll to zoom • 🖱️ Right-click drag to pan
  </div>

  <!-- Controls Dock -->
  <div class="fs-controls-dock">
    <button class="fs-btn" onclick="toggleAutoRotate()" id="btnAutoRotate">
      <span>⏸️ Pause Rotation</span>
    </button>
    <button class="fs-btn" onclick="resetCamera()">
      <span>🔄 Reset View</span>
    </button>
    <button class="fs-btn primary" onclick="toggleBrowserFullscreen()">
      <span>⛶ Toggle Fullscreen</span>
    </button>
    <button class="fs-btn danger" onclick="closeOrBack()">
      <span>✕ Close</span>
    </button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const modelName = params.get('model') || '';
    const titleName = params.get('title') || '3D Specimen';
    const category = params.get('category') || '3D Studio';
    const imageName = params.get('image') || '';

    document.getElementById('fsTitle').textContent = titleName;
    document.getElementById('fsLoaderName').textContent = titleName;
    document.getElementById('fsCategoryBadge').textContent = category;
    document.title = `${titleName} — 3D Fullscreen Studio | AlphaMat`;

    const viewer = document.getElementById('fsModelViewer');
    const loader = document.getElementById('fsLoader');

    function showSpecimenStudioCard() {
      loader.classList.add('hidden');
      viewer.style.display = 'none';
      const hint = document.querySelector('.fs-gesture-hint');
      if (hint) hint.style.display = 'none';
      const btnRot = document.getElementById('btnAutoRotate');
      if (btnRot) btnRot.style.display = 'none';

      let stageEl = document.getElementById('fsCustomStage');
      if (!stageEl) {
        stageEl = document.createElement('div');
        stageEl.id = 'fsCustomStage';
        stageEl.style.cssText = 'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;background:radial-gradient(circle at center, #1e293b 0%, #0b111e 100%);z-index:50;';
        document.body.appendChild(stageEl);
      }
      const imgSrc = imageName ? `images/${encodeURIComponent(imageName)}` : 'images/alphamat_logo.png';
      stageEl.innerHTML = `
        <div style="background: rgba(18,26,43,0.8); backdrop-filter: blur(16px); padding: 36px 48px; border-radius: 28px; border: 1px solid rgba(255,255,255,0.15); max-width: 580px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
          <img src="${imgSrc}" alt="${titleName}" style="max-height: 260px; max-width: 380px; object-fit: contain; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); margin-bottom: 20px;" onerror="this.src='images/alphamat_logo.png'">
          <h2 style="font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 6px;">${titleName}</h2>
          <div style="font-size: 0.95rem; font-weight: 700; color: #EB5E41; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 16px;">${category} • AlphaMat 3D Studio</div>
          <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(235,94,65,0.15); border: 1px solid rgba(235,94,65,0.35); color: #FF8A65; padding: 8px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 700;">
            ✨ 3D AR Model in Active Development
          </div>
        </div>
      `;
    }

    if (modelName && modelName !== 'null' && modelName !== 'undefined') {
      let modelPath = `model/${encodeURIComponent(modelName)}`;
      viewer.src = modelPath;

      viewer.addEventListener('load', () => {
        loader.classList.add('hidden');
      });

      viewer.addEventListener('error', () => {
        viewer.src = `letter_model/${encodeURIComponent(modelName)}`;
        viewer.addEventListener('load', () => {
          loader.classList.add('hidden');
        });
        viewer.addEventListener('error', () => {
          showSpecimenStudioCard();
        });
      });
    } else {
      showSpecimenStudioCard();
    }

    let isRotating = true;
    function toggleAutoRotate() {
      isRotating = !isRotating;
      viewer.autoRotate = isRotating;
      document.getElementById('btnAutoRotate').innerHTML = isRotating 
        ? '<span>⏸️ Pause Rotation</span>' 
        : '<span>▶️ Auto Rotate</span>';
    }

    function resetCamera() {
      viewer.cameraOrbit = '0deg 75deg 105%';
      viewer.resetTurntableRotation();
    }

    function toggleBrowserFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn('Fullscreen request failed:', err);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function closeOrBack() {
      if (window.history.length > 1) {
        window.close();
        // If window.close() blocked by browser:
        setTimeout(() => {
          window.history.back();
        }, 150);
      } else {
        window.close();
      }
    }
  </script>
</body>
</html>

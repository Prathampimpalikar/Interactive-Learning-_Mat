<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Learning Mat</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: dark; --ink: #f8fafc; --muted: #a7b0c0; --panel: #18212b; --line: #334155; --accent: #38bdf8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, #164e63 0, #0b1220 42%, #070b12 100%); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(1100px, 100%); margin: auto; padding: 32px 20px; }
    header { margin-bottom: 24px; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 4rem); line-height: 1; letter-spacing: 0; }
    p { color: var(--muted); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; }
    select, button { border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; color: var(--ink); background: var(--panel); font: inherit; }
    button { cursor: pointer; background: var(--accent); color: #062033; font-weight: 700; }
    .stage { overflow: hidden; min-height: 65vh; border: 1px solid var(--line); border-radius: 8px; background: #111827; }
    model-viewer { width: 100%; height: 65vh; min-height: 420px; }
    .status { min-height: 24px; margin: 10px 0 0; }
    @media (max-width: 650px) { main { padding: 24px 14px; } .controls > * { flex: 1 1 100%; } }
  </style>
</head>
<body>
  <main>
    <header><p>INTERACTIVE LEARNING MAT</p><h1>Explore the world in 3D.</h1><p>Select a model, rotate it, and use AR on a compatible device.</p></header>
    <div class="controls">
      <select id="modelSelect" aria-label="Choose a 3D model"><option value="">Choose a model</option></select>
      <button id="loadButton" type="button">Load model</button>
    </div>
    <p id="status" class="status" role="status"></p>
    <section class="stage"><model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1" ar alt="Interactive 3D learning model"></model-viewer></section>
  </main>
  <script>
    const select = document.querySelector('#modelSelect');
    const viewer = document.querySelector('#viewer');
    const status = document.querySelector('#status');
    const models = ['Alligator.glb', 'alpaca.glb', 'ant.glb', 'Apple.glb', 'Avocado.glb', 'Banana.glb', 'Bear.glb', 'Bee.glb', 'Buffalo.glb', 'Camel.glb', 'Cat.glb', 'Cherry.glb', 'Coconut.glb', 'Cow.glb'];
    models.forEach(model => select.add(new Option(model.replace('.glb', ''), model)));
    function loadModel() {
      if (!select.value) { status.textContent = 'Choose a model to begin.'; return; }
      viewer.src = `model/${encodeURIComponent(select.value)}`;
      status.textContent = `Viewing ${select.value.replace('.glb', '')}`;
    }
    document.querySelector('#loadButton').addEventListener('click', loadModel);
    select.addEventListener('change', loadModel);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Learning App - 3D Learning Mat</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #111827;
      --card: #1f293d;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --accent-secondary: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, #1e1b4b 0%, #0b0f19 60%, #030712 100%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 24px;
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px 60px;
      flex: 1;
      width: 100%;
    }

    .hero-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .hero-section h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .hero-section p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 680px;
      margin: 0 auto;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: stretch;
    }

    .sidebar {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      backdrop-filter: blur(12px);
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .filter-btn {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #04101e;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .items-grid::-webkit-scrollbar {
      width: 6px;
    }
    .items-grid::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }

    .model-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .model-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .model-card.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .model-icon {
      font-size: 26px;
    }

    .model-name {
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .stage-container {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 580px;
      backdrop-filter: blur(12px);
    }

    .stage-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.2);
    }

    .active-info h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }

    .active-info span {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stage-tools {
      display: flex;
      gap: 10px;
    }

    .tool-btn {
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
    }

    model-viewer {
      width: 100%;
      height: 100%;
      min-height: 500px;
      flex: 1;
      --poster-color: transparent;
      outline: none;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .loading-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      background: rgba(11, 15, 25, 0.9);
      margin-top: auto;
    }

    @media (max-width: 900px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
      .stage-container {
        min-height: 450px;
      }
      model-viewer {
        min-height: 400px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <div class="brand-logo">🧩</div>
        <div>
          <div class="brand-title">Interactive Learning App</div>
        </div>
      </a>
      <span class="badge">3D & AR Enabled</span>
    </div>
  </header>

  <main>
    <div class="hero-section">
      <h1>Explore & Learn in Interactive 3D</h1>
      <p>Select any animal or fruit to view and rotate the 3D model in real time.</p>
    </div>

    <div class="app-layout">
      <!-- Sidebar / Model Selector -->
      <div class="sidebar">
        <div class="filter-tabs">
          <button class="filter-btn active" data-category="all">All</button>
          <button class="filter-btn" data-category="animals">Animals 🦁</button>
          <button class="filter-btn" data-category="fruits">Fruits 🍎</button>
        </div>

        <div class="items-grid" id="itemsGrid"></div>
      </div>

      <!-- 3D Stage -->
      <div class="stage-container">
        <div class="stage-header">
          <div class="active-info">
            <h3 id="currentTitle">Alligator</h3>
            <span id="currentCategory">Category: Animals</span>
          </div>
          <div class="stage-tools">
            <button class="tool-btn" id="resetCamBtn">🔄 Reset Camera</button>
          </div>
        </div>

        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <p>Loading 3D Model...</p>
        </div>

        <model-viewer
          id="viewer"
          src="model/Alligator.glb"
          camera-controls
          auto-rotate
          shadow-intensity="1.2"
          shadow-softness="0.8"
          exposure="1"
          ar
          ar-modes="webxr scene-viewer quick-look"
          alt="Interactive 3D model">
        </model-viewer>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Interactive Learning App • Interactive Learning Mat Project</p>
  </footer>

  <script>
    const modelsData = [
      { name: "Alligator", file: "Alligator.glb", category: "animals", icon: "🐊" },
      { name: "Alpaca", file: "alpaca.glb", category: "animals", icon: "🦙" },
      { name: "Ant", file: "ant.glb", category: "animals", icon: "🐜" },
      { name: "Apple", file: "Apple.glb", category: "fruits", icon: "🍎" },
      { name: "Avocado", file: "Avocado.glb", category: "fruits", icon: "🥑" },
      { name: "Banana", file: "Banana .glb", category: "fruits", icon: "🍌" },
      { name: "Bear", file: "Bear.glb", category: "animals", icon: "🐻" },
      { name: "Bee", file: "Bee.glb", category: "animals", icon: "🐝" },
      { name: "Blackberries", file: "Blackberries.glb", category: "fruits", icon: "🫐" },
      { name: "Blueberries", file: "Blueberries.glb", category: "fruits", icon: "🫐" },
      { name: "Buffalo", file: "Buffalo.glb", category: "animals", icon: "🦬" },
      { name: "Camel", file: "Camel.glb", category: "animals", icon: "🐪" },
      { name: "Cat", file: "Cat.glb", category: "animals", icon: "🐱" },
      { name: "Cherry", file: "Cherry.glb", category: "fruits", icon: "🍒" },
      { name: "Coconut", file: "Coconut.glb", category: "fruits", icon: "🥥" },
      { name: "Cow", file: "Cow.glb", category: "animals", icon: "🐄" },
      { name: "Red Ant", file: "Red ant.glb", category: "animals", icon: "🐜" }
    ];

    const itemsGrid = document.getElementById('itemsGrid');
    const viewer = document.getElementById('viewer');
    const currentTitle = document.getElementById('currentTitle');
    const currentCategory = document.getElementById('currentCategory');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const resetCamBtn = document.getElementById('resetCamBtn');

    let currentFilter = 'all';
    let selectedModel = modelsData[0];

    function renderList() {
      itemsGrid.innerHTML = '';
      const filtered = modelsData.filter(item => currentFilter === 'all' || item.category === currentFilter);
      
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `model-card ${item.name === selectedModel.name ? 'active' : ''}`;
        card.innerHTML = `
          <div class="model-icon">${item.icon}</div>
          <div class="model-name">${item.name}</div>
        `;
        card.onclick = () => selectModel(item);
        itemsGrid.appendChild(card);
      });
    }

    function selectModel(item) {
      selectedModel = item;
      currentTitle.textContent = item.name;
      currentCategory.textContent = `Category: ${item.category.charAt(0).toUpperCase() + item.category.slice(1)}`;
      
      loadingOverlay.classList.add('active');
      viewer.src = `model/${encodeURIComponent(item.file)}`;
      
      renderList();
    }

    viewer.addEventListener('load', () => {
      loadingOverlay.classList.remove('active');
    });

    viewer.addEventListener('error', () => {
      loadingOverlay.classList.remove('active');
    });

    resetCamBtn.addEventListener('click', () => {
      viewer.cameraOrbit = "0deg 75deg 105%";
      viewer.resetTurntable();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-category');
        renderList();
      });
    });

    renderList();
  </script>
</body>
</html>

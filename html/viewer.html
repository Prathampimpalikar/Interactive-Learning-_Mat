<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>3D Viewer</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{

margin:0;
background:#202124;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

}

model-viewer{

width:100%;
height:100%;

}

</style>

</head>

<body>

<model-viewer

id="viewer"

camera-controls

auto-rotate

shadow-intensity="1"

ar

>

</model-viewer>

<script>

const params = new URLSearchParams(window.location.search);

const model = params.get("model");

const viewer = document.getElementById("viewer");

if (!model || model === "nan") {
    document.body.innerHTML = '<div style="color:#ffffff;font-family:Arial,sans-serif;font-size:22px;text-align:center;padding:20px;">⚠️ No 3D Model Specified for this Item</div>';
} else {
    viewer.src = "../model/" + model;
    viewer.addEventListener('error', (event) => {
        document.body.innerHTML = '<div style="color:#ff6b6b;font-family:Arial,sans-serif;font-size:22px;text-align:center;padding:20px;">⚠️ 3D Model File (' + model + ') Not Found on Local Server.<br><span style="font-size:16px;color:#cccccc;">Please add ' + model + ' to the model/ directory.</span></div>';
    });
}

</script>

</body>
</html>
